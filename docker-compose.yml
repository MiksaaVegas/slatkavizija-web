services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: 0.35
    mem_limit: 512m
    volumes:
      - .stack-data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
