services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: 0.35
    mem_limit: 512m
    volumes:
      - .stack-data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
