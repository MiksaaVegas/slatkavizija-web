server {
  listen 80;
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  charset utf-8;

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
  }
}
